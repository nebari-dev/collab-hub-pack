[project]
name = "cog-small-model"
version = "0.1.0"
description = "Model-only Cog: a small instruct model with the runtime needed to serve it."
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.11"

[tasks]
fetch = "python scripts/fetch_model.py"
serve = { cmd = "example-server --model models/model.gguf --port 8080", depends-on = ["fetch"] }
check = "python scripts/check.py"

[tool.nebi.bundle]
exclude = ["models/**", "*.gguf"]
