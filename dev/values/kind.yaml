# Helm values for the local kind tier (`make kind-up`).
#
# No NebariApp and no Ingress: the chart's protection map stays unenforced,
# which is what makes the dev-auth switches below legal. With
# api.ingress.enabled=true the chart REFUSES to render them — see
# docs/standalone-deployment.md. Reach the API with `make kind-forward`.

fullnameOverride: collab-hub

api:
  nebariapp:
    enabled: false
  ingress:
    enabled: false
  deployment:
    image:
      repository: collab-hub-api
      tag: dev
      pullPolicy: Never
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    extraEnv:
      - name: FRAMES_UNSAFE_AUTH_ENABLED
        value: "true"
      - name: DEV_AUTH_ENABLED
        value: "true"
      - name: DEV_AUTH_USER
        value: dev-user
      - name: DEV_AUTH_ORG
        value: dev-org
      - name: DEV_AUTH_WORKSPACE
        value: default
      - name: FRAMES_BEARER_ALLOW_UNSIGNED
        value: "true"

frames:
  storage:
    backend: local
  auth:
    defaults:
      orgId: dev-org
      workspaceId: default

tasks:
  backend: memory
