[project]
name = "collab-hub-execution"
version = "0.1.0"
description = "Collab Hub Cog & Op execution: durable engine, Track, model binding, and pluggable executors"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "pytest>=8.3.0",
    "psycopg[binary,pool]>=3.1",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I001",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
