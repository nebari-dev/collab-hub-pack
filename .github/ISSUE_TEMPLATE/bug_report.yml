name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Chart/image tag or commit SHA of Collab Hub API.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Nebari/NIC version, Kubernetes version, how it's deployed.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs. Do NOT paste tokens, secrets, or private data.
      render: shell
