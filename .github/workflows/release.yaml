name: Release Chart

# Releases the collab-hub chart via the shared reusable workflow in
# nebari-dev/.github: pins the chart's image tag to the release commit's sha,
# packages the chart, creates a GitHub Release, and opens a PR in
# nebari-dev/helm-repository.
#
# Runs only when dispatched. semantic-release.yml dispatches it from a
# collab-hub-<version> tag, whose Chart.yaml carries the release version, after
# dispatching build-images.yaml from the same tag for the matching
# sha-<short> image. Chart.yaml on main holds a placeholder version and never
# releases. Publishing relies on the org-provided NEBARI_HELM_REPO_TOKEN
# secret.

on:
  workflow_dispatch:

jobs:
  release:
    uses: nebari-dev/.github/.github/workflows/pack-release.yaml@v1
    with:
      chart-path: helm/collab-hub
      chart-name: collab-hub
      tag-paths: |
        api.deployment.image.tag
    secrets:
      NEBARI_HELM_REPO_TOKEN: ${{ secrets.NEBARI_HELM_REPO_TOKEN }}
