name: Semantic Release

# Cuts the release from the squash commits on main: computes the next version
# from conventional commits, writes CHANGELOG.md, pins the version into
# Chart.yaml and api/pyproject.toml (scripts/release/bump-version.py), commits
# that back to main, and creates the v<version> tag and GitHub Release.
#
# The bump commit deliberately does NOT carry [skip ci]: its push is what
# triggers release.yaml (pack-release packages the chart, pins the image sha,
# and syncs to helm-repository) and build-images.yaml (builds the sha image
# that pinned chart references). semantic-release's own re-run on that push
# finds no releasable commits and exits without releasing.
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The default GITHUB_TOKEN cannot trigger the downstream workflows
          # on the commit/tag it pushes; without a PAT/app token the
          # pack-release and image build for the bump commit never start.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GIT_AUTHOR_NAME: openteams-release-bot
          GIT_AUTHOR_EMAIL: releases@openteams.com
          GIT_COMMITTER_NAME: openteams-release-bot
          GIT_COMMITTER_EMAIL: releases@openteams.com
        run: |
          npx --yes \
            -p semantic-release@24.2.9 \
            -p @semantic-release/changelog@6.0.3 \
            -p @semantic-release/exec@7.1.0 \
            -p @semantic-release/git@10.0.1 \
            semantic-release
