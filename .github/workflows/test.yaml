name: Test

# Runs the Collab Hub API test suite (pytest, in api/). Fork-safe: no secrets,
# read-only checkout. uv provisions the pinned Python and the `test` group.
#
# A PostgreSQL service backs the live suites. Without it 139 tests -- every test
# that touches real SQL -- were skipped, so the guarantees they exist to hold
# were asserted nowhere that gates a merge: one organization under concurrent
# acceptance, a token that cannot be redeemed twice, an audited mutation
# committing with its event row or not at all. They cost about 40 seconds.

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/test.yaml"
  pull_request: {}   # runs on every PR so it can be a required status check

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # A database the suite owns outright. The live fixtures DROP and recreate
      # their tables, so this must not be shared with anything else -- a service
      # container per job is exactly that.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: collabtest
        ports:
          - 5432:5432
        # The classic failure here is a race: the container is up before the
        # server accepts connections. `pg_isready` is the server's own answer to
        # that, and the job will not start a step until it passes.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # patch-coverage diffs against the base branch

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests with coverage
        working-directory: api
        # Not --frozen: the rename changes the project's own package entry, so
        # uv reconciles uv.lock's project record on sync. Deps stay pinned.
        # --cov-fail-under enforces the global floor here (not in addopts) so a
        # scoped local run isn't failed for not exercising the whole package.
        env:
          # Setting this is what un-skips the live suites; the `skipif` reads it
          # directly. A disposable database, named so a reader of a failure can
          # tell it apart from anything real.
          COLLAB_HUB_TEST_POSTGRES_URL: postgresql://postgres:test@localhost:5432/collabtest
        run: uv run --group test pytest --cov-fail-under=85

      - name: Confirm the live suites actually ran
        working-directory: api
        # The failure this catches is silent and total: rename the variable, or
        # let the service drop out, and `skipif` quietly removes 139 tests while
        # the job stays green. A count assertion is the only thing that notices,
        # because a skipped test looks exactly like a test that had nothing to
        # say.
        env:
          COLLAB_HUB_TEST_POSTGRES_URL: postgresql://postgres:test@localhost:5432/collabtest
        run: |
          set -euo pipefail
          live=$(uv run --group test pytest --no-cov -q --collect-only \
            -k "live or differential" 2>/dev/null | tail -1)
          echo "collected: ${live}"
          count=$(uv run --group test pytest --no-cov -q -k "live or differential" 2>&1 \
            | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+')
          echo "live tests passed: ${count}"
          if [ "${count:-0}" -lt 100 ]; then
            echo "expected the live suites to run (>=100 tests); the service or the" >&2
            echo "environment variable is not reaching pytest." >&2
            exit 1
          fi

      - name: Patch coverage (changed lines)
        if: github.event_name == 'pull_request'
        working-directory: api
        # New and changed lines are held to a higher bar than the legacy global
        # floor: cover what you add. Compares this PR's coverage.xml against the
        # base branch.
        run: |
          uv run --group test diff-cover coverage.xml \
            --compare-branch "origin/${{ github.base_ref }}" \
            --fail-under 90
