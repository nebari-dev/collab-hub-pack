name: Build Docker Images

# Builds and publishes the Collab Hub API image via the shared reusable
# workflow in nebari-dev/.github. The image is pushed to GHCR and quay.io
# with `sha-<short>` and (on main) `latest`.
#
# The Chart.yaml path is in the trigger because release.yaml pins image tags
# to sha-<release-commit>, so the release commit (a Chart.yaml bump) must
# produce images with that sha.

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "helm/collab-hub/Chart.yaml"
      - ".github/workflows/build-images.yaml"
  pull_request:
    paths:
      - "api/**"
  workflow_dispatch:

jobs:
  api:
    uses: nebari-dev/.github/.github/workflows/pack-build-image.yaml@v1
    with:
      image: api
      context: api
      push: ${{ github.event_name != 'pull_request' }}
    secrets:
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}

  # Surfaces the tag to deploy so an operator can copy it straight from the
  # run and bump the infra repo (see the infra repos' "Deploying an update").
  deploy-tag:
    needs: api
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Show deploy tag
        run: |
          short="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "Deploy this build by setting the infra repo image tag to: **sha-${short}**" >> "$GITHUB_STEP_SUMMARY"
